<!DOCTYPE html>
<html>
<head>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background: #0b1429; flex-direction: column; gap: 50px; }
  
  .oppo-light {
    font-family: 'Montserrat', 'Arial', sans-serif;
    font-weight: 900;
    font-size: 6rem;
    letter-spacing: 0.2em;
    color: #ffffff;
    text-shadow: 
      0 1px 0 #cbd5e1, 
      0 2px 0 #94a3b8, 
      0 3px 0 #64748b, 
      0 4px 0 #475569, 
      0 5px 0 #334155, 
      0 6px 1px rgba(0,0,0,.1), 
      0 0 5px rgba(0,0,0,.1), 
      0 1px 3px rgba(0,0,0,.3), 
      0 3px 5px rgba(0,0,0,.2), 
      0 5px 10px rgba(0,0,0,.25), 
      0 10px 10px rgba(0,0,0,.2), 
      0 20px 20px rgba(0,0,0,.15);
    transform: rotateX(15deg) rotateY(-10deg) translateZ(30px);
    background: #f8fafc; padding: 50px; border-radius: 20px;
  }

  .oppo-dark {
    font-family: 'Montserrat', 'Arial', sans-serif;
    font-weight: 900;
    font-size: 6rem;
    letter-spacing: 0.2em;
    color: #ffffff;
    text-shadow: 
      0 1px 0 #94a3b8, 
      0 2px 0 #64748b, 
      0 3px 0 #475569, 
      0 4px 0 #334155, 
      0 5px 0 #1e293b, 
      0 6px 1px rgba(0,0,0,.5), 
      0 0 15px rgba(34,211,238,0.6), 
      0 1px 5px rgba(34,211,238,0.5), 
      0 3px 15px rgba(34,211,238,0.4), 
      0 5px 25px rgba(34,211,238,0.3);
    transform: rotateX(15deg) rotateY(-10deg) translateZ(30px);
  }
</style>
</head>
<body>
  <div class="oppo-light">OPPO</div>
  <div class="oppo-dark">OPPO</div>
</body>
</html>
